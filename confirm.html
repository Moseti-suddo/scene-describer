<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency Alert</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #FFD400;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 20px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  h1 { font-size: 24px; margin-bottom: 6px; }
  p { color: #ddd; font-size: 16px; line-height: 1.5; }
  .map-link {
    display: inline-block;
    margin: 14px 0;
    color: #4ADE80;
    font-weight: 700;
    text-decoration: none;
    font-size: 16px;
  }
  .confirm-btn {
    width: 100%;
    padding: 22px;
    font-size: 20px;
    font-weight: 700;
    background: #FFD400;
    color: #000;
    border: none;
    border-radius: 14px;
    margin-top: 18px;
  }
  .confirm-btn:disabled { background: #4ADE80; color: #000; }
  .status-text { margin-top: 16px; font-size: 16px; font-weight: 700; color: #4ADE80; min-height: 20px; }
  .error-text { margin-top: 16px; font-size: 15px; color: #FF6B6B; min-height: 20px; }
</style>
</head>
<body>
<div class="card">
  <h1>Emergency Alert</h1>
  <p id="intro">Someone using Scene Describer needs help and listed you as their emergency contact.</p>
  <a class="map-link" id="mapLink" href="#" target="_blank" rel="noopener" style="display:none;">View their location on the map</a>
  <button class="confirm-btn" id="confirmBtn">I'm on my way</button>
  <div class="status-text" id="statusText"></div>
  <div class="error-text" id="errorText"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const confirmBtn = document.getElementById('confirmBtn');
  const statusText = document.getElementById('statusText');
  const errorText = document.getElementById('errorText');
  const mapLink = document.getElementById('mapLink');
  const intro = document.getElementById('intro');

  async function loadStatus() {
    if (!id) {
      intro.textContent = 'This link is missing information and cannot be used.';
      confirmBtn.style.display = 'none';
      return;
    }
    try {
      const res = await fetch('/api/sos-status?id=' + encodeURIComponent(id));
      const data = await res.json();

      if (!res.ok || data.status === 'not_found') {
        intro.textContent = 'This alert has expired or could not be found.';
        confirmBtn.style.display = 'none';
        return;
      }

      if (data.lat && data.lng) {
        mapLink.href = `https://maps.google.com/?q=${data.lat},${data.lng}`;
        mapLink.style.display = 'inline-block';
      }

      if (data.status === 'confirmed') {
        confirmBtn.disabled = true;
        confirmBtn.textContent = "Confirmed \u2713";
        statusText.textContent = "You've already confirmed you're coming.";
      }
    } catch (err) {
      errorText.textContent = 'Could not load this alert. Check your connection.';
    }
  }

  confirmBtn.addEventListener('click', async () => {
    if (!id) return;
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Confirming…';
    errorText.textContent = '';

    try {
      const res = await fetch('/api/sos-confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Failed to confirm');

      confirmBtn.textContent = "Confirmed \u2713";
      statusText.textContent = "Thanks — they'll be notified that you're on your way.";
    } catch (err) {
      confirmBtn.disabled = false;
      confirmBtn.textContent = "I'm on my way";
      errorText.textContent = 'Something went wrong. Please try again.';
    }
  });

  loadStatus();
</script>
</body>
</html>
