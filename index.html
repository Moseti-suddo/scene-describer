<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scene Describer</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: #000000;
    color: #FFD400;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 16px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin: 4px 0 12px;
    letter-spacing: 0.5px;
  }
  .video-frame {
    position: relative;
    width: 100%;
    flex: 0 0 auto;
    aspect-ratio: 4 / 3;
    background: #111;
    border: 3px solid #FFD400;
    border-radius: 12px;
    overflow: hidden;
  }
  video, canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  canvas { display: none; }

  .state-ring {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    pointer-events: none;
    border: 4px solid transparent;
    transition: border-color 0.2s ease;
  }
  .state-ring.listening { border-color: #4ADE80; animation: pulse 1.1s infinite; }
  .state-ring.thinking { border-color: #FFD400; animation: pulse 1.1s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  .status-badge {
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    margin: 12px 0 8px;
    min-height: 24px;
  }

  .result {
    flex: 1;
    margin-top: 6px;
    background: #111;
    border: 2px solid #333;
    border-radius: 12px;
    padding: 16px;
    font-size: 19px;
    line-height: 1.5;
    color: #FFFFFF;
    overflow-y: auto;
  }
  .result.empty { color: #888; font-size: 16px; font-weight: 400; }
  .turn { margin-bottom: 12px; }
  .turn .role { font-size: 12px; font-weight: 700; color: #FFD400; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }

  .tap-hint {
    text-align: center;
    font-size: 15px;
    color: #999;
    margin-top: 8px;
    font-weight: 600;
  }

  .error {
    color: #FF6B6B;
    font-weight: 700;
    text-align: center;
    margin-top: 6px;
    min-height: 20px;
  }

  .switch-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 5;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    background: rgba(0,0,0,0.6);
    color: #FFD400;
    border: 2px solid #FFD400;
    border-radius: 10px;
  }
  .switch-btn:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 2px; }

  .tap-layer {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="app">
  <h1>Scene Describer</h1>

  <div class="video-frame">
    <video id="video" autoplay playsinline muted aria-hidden="true"></video>
    <canvas id="canvas"></canvas>
    <div class="state-ring" id="stateRing"></div>
    <button class="switch-btn" id="switchBtn">Switch camera</button>
  </div>

  <div class="status-badge" id="status" role="status" aria-live="polite">Starting camera…</div>
  <div class="error" id="error" role="alert"></div>

  <div class="result empty" id="result" aria-live="polite">
    Double-tap anywhere on the screen to start. Then just talk.
  </div>

  <div class="tap-hint" id="tapHint">Double-tap anywhere to begin</div>
</div>

<!-- Full-screen invisible layer so a double-tap ANYWHERE activates listening -->
<div class="tap-layer" id="tapLayer"></div>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');
  const resultEl = document.getElementById('result');
  const stateRing = document.getElementById('stateRing');
  const switchBtn = document.getElementById('switchBtn');
  const tapLayer = document.getElementById('tapLayer');
  const tapHint = document.getElementById('tapHint');

  let currentStream = null;
  let facingMode = 'environment';

  // Conversation state: the photo currently being discussed, plus the
  // back-and-forth so far. A fresh "describe" resets both.
  let activeImageBase64 = null;
  let conversationHistory = []; // [{ role: 'user'|'assistant', text }]

  // App state machine: 'idle' | 'listening' | 'thinking' | 'speaking'
  let appState = 'idle';

  const DESCRIBE_KEYWORDS = [
    'describe', 'what is around', "what's around", 'look around',
    'new picture', 'take a picture', 'whats here', "what's here",
    'start over', 'new scene', 'look again'
  ];

  function setState(state) {
    appState = state;
    stateRing.classList.remove('listening', 'thinking');
    if (state === 'listening') stateRing.classList.add('listening');
    if (state === 'thinking') stateRing.classList.add('thinking');
  }

  function setStatus(text) { statusEl.textContent = text; }
  function setError(text) { errorEl.textContent = text || ''; }

  function speak(text, onDone) {
    if (!('speechSynthesis' in window)) { if (onDone) onDone(); return; }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1;
    utter.pitch = 1;
    setState('speaking');
    utter.onend = () => { if (onDone) onDone(); };
    utter.onerror = () => { if (onDone) onDone(); };
    window.speechSynthesis.speak(utter);
  }

  function appendTurn(role, text) {
    if (resultEl.classList.contains('empty')) {
      resultEl.classList.remove('empty');
      resultEl.innerHTML = '';
    }
    const div = document.createElement('div');
    div.className = 'turn';
    div.innerHTML = `<div class="role">${role === 'user' ? 'You asked' : 'Description'}</div><div>${text}</div>`;
    resultEl.appendChild(div);
    resultEl.scrollTop = resultEl.scrollHeight;
  }

  // ---------- Camera ----------
  async function startCamera() {
    setError('');
    setStatus('Starting camera…');
    if (currentStream) currentStream.getTracks().forEach(t => t.stop());
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facingMode } },
        audio: false
      });
      currentStream = stream;
      video.srcObject = stream;
      await video.play();
      setStatus('Ready. Double-tap anywhere to begin.');
    } catch (err) {
      setStatus('');
      setError('Could not access the camera. Check permissions and try again.');
    }
  }

  function captureFrameBase64() {
    const w = video.videoWidth;
    const h = video.videoHeight;
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);
    return canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
  }

  switchBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    startCamera();
  });

  // ---------- Speech recognition (capturing what the user says) ----------
  const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  let voiceSupported = !!SpeechRecognitionImpl;

  if (voiceSupported) {
    recognizer = new SpeechRecognitionImpl();
    recognizer.continuous = false;
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
  }

  function listenOnce({ timeoutMs = 6000 } = {}) {
    return new Promise((resolve) => {
      if (!voiceSupported) { resolve(null); return; }

      setState('listening');
      setStatus('Listening…');
      tapHint.textContent = '';

      let settled = false;
      const finish = (val) => {
        if (settled) return;
        settled = true;
        try { recognizer.stop(); } catch (e) {}
        resolve(val);
      };

      const timer = setTimeout(() => finish(null), timeoutMs);

      recognizer.onresult = (event) => {
        clearTimeout(timer);
        const text = event.results?.[0]?.[0]?.transcript || '';
        finish(text.trim());
      };
      recognizer.onerror = () => { clearTimeout(timer); finish(null); };
      recognizer.onend = () => { clearTimeout(timer); finish(null); };

      try {
        recognizer.start();
      } catch (e) {
        clearTimeout(timer);
        finish(null);
      }
    });
  }

  // ---------- Backend call ----------
  async function askBackend({ question }) {
    setState('thinking');
    setStatus('Thinking…');

    const isFreshScene = !activeImageBase64 || conversationHistory.length === 0;

    if (isFreshScene) {
      activeImageBase64 = captureFrameBase64();
      conversationHistory = [];
    }

    const body = {
      image: activeImageBase64,
      history: conversationHistory,
      question: question || ''
    };

    const response = await fetch('/api/describe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.error || 'Request failed');
    }

    const answer = (data.description || '').trim();
    if (!answer) throw new Error('Empty response');

    // Record this turn in the conversation.
    const userTurnText = question && question.trim()
      ? question.trim()
      : 'Describe what is in front of me.';
    conversationHistory.push({ role: 'user', text: userTurnText });
    conversationHistory.push({ role: 'assistant', text: answer });

    if (question && question.trim()) {
      appendTurn('user', userTurnText);
    }
    appendTurn('assistant', answer);

    return answer;
  }

  function looksLikeFreshSceneRequest(text) {
    if (!text) return false;
    const lower = text.toLowerCase();
    return DESCRIBE_KEYWORDS.some(k => lower.includes(k));
  }

  // ---------- The core interaction loop ----------
  async function runInteractionCycle(initialSpeech) {
    let speechText = initialSpeech;

    // First activation (double-tap): no speech captured yet unless voice
    // recognition ran as part of the tap itself. If nothing was said, or it
    // sounds like a request for a fresh scene, treat it as "describe now".
    if (speechText === undefined) {
      speechText = voiceSupported ? await listenOnce({ timeoutMs: 4000 }) : null;
    }

    const wantsFreshScene = !speechText || looksLikeFreshSceneRequest(speechText);
    if (wantsFreshScene) {
      // A fresh scene request always resets the conversation.
      activeImageBase64 = null;
      conversationHistory = [];
    }

    try {
      const answer = await askBackend({ question: wantsFreshScene ? '' : speechText });
      setStatus('');
      setError('');

      await new Promise(resolve => speak(answer, resolve));

      // Auto-listen for a follow-up without requiring another tap.
      setState('listening');
      setStatus('Listening for a follow-up… or stay quiet to finish.');
      const followUp = voiceSupported ? await listenOnce({ timeoutMs: 5000 }) : null;

      if (followUp) {
        await runInteractionCycle(followUp);
      } else {
        setState('idle');
        setStatus('Ready. Double-tap anywhere to talk again.');
        tapHint.textContent = 'Double-tap anywhere to begin';
      }
    } catch (err) {
      setError("Something went wrong. Double-tap to try again.");
      setState('idle');
      setStatus('');
      tapHint.textContent = 'Double-tap anywhere to begin';
    }
  }

  // ---------- Double-tap detection, anywhere on screen ----------
  let lastTapTime = 0;
  const DOUBLE_TAP_WINDOW_MS = 400;

  function handleActivationTap(e) {
    // Ignore taps on the switch-camera button; it has its own handler.
    if (e.target.closest && e.target.closest('.switch-btn')) return;

    const now = Date.now();
    const isDoubleTap = (now - lastTapTime) < DOUBLE_TAP_WINDOW_MS;
    lastTapTime = now;

    if (!isDoubleTap) return;
    if (appState === 'listening' || appState === 'thinking') return; // already active

    window.speechSynthesis.cancel();
    runInteractionCycle(undefined);
  }

  tapLayer.addEventListener('touchend', handleActivationTap, { passive: true });
  tapLayer.addEventListener('click', handleActivationTap);

  // ---------- Init ----------
  if (!voiceSupported) {
    setError('Voice recognition is not supported in this browser. Double-tap will still describe the scene, but spoken follow-up questions will not work here.');
  }

  startCamera();
</script>
</body>
</html>
